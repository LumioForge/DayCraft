<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayCraft – Prati Navike</title>
    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicons/favicon.png"
    />

    <!-- Tailwind CSS + DaisyUI (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-base-100">
    <!-- navbar -->
    <nav class="navbar bg-base-100 shadow-sm px-4 py-2">
      <div class="navbar-start">
        <a
          href="index.html"
          class="text-2xl font-bold text-primary"
          >DayCraft</a
        >
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li><a href="daily-planner.html">Rutina</a></li>
          <li><a href="habbit-tracker.html">Navike</a></li>
        </ul>
      </div>
      <div class="navbar-end">
        <!-- profilni izbornik -->
        <div class="dropdown dropdown-end">
          <label tabindex="0" class="btn btn-ghost btn-circle avatar">
            <div class="w-8 rounded-full">
              <img
                src="https://api.dicebear.com/5.x/initials/svg?seed=U"
                alt="Profilna slika"
              />
            </div>
          </label>
          <ul
            tabindex="0"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box shadow mt-3 w-52"
          >
            <li><a href="settings.html">Postavke</a></li>
            <li><a href="register.html">Odjava</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Prati naviku -->
    <main class="p-4 max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-3xl font-bold">Habit Tracker</h1>
        <button id="openAddHabitBtn" class="btn btn-primary">Add Habit</button>
      </div>
      <div id="habitList">
      </div>
      <section class="mt-8">
        <h2 class="text-2xl font-semibold mb-4">Your Habit Stats</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="card bg-base-100 p-4 shadow">
            <h3 class="font-bold mb-2 text-center">Habits Completed per Day (Last 7 days)</h3>
            <canvas id="habitsBarChart" width="400" height="300"></canvas>
          </div>
          <div class="card bg-base-100 p-4 shadow">
            <h3 class="font-bold mb-2 text-center">Completion by Habit (Last 7 days)</h3>
            <canvas id="habitsDonutChart" width="400" height="300"></canvas>
          </div>
        </div>
      </section>
    </main>

    <!-- Dodaj naviku -->
    <dialog id="habitModal" class="modal">
      <form method="dialog" class="modal-box">
        <button type="button" id="closeHabitModal" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        <h3 class="font-bold text-lg mb-4">New Habit</h3>
        <div class="form-control mb-3">
          <label class="label font-semibold" for="habitName">Habit Name</label>
          <input id="habitName" type="text" class="input input-bordered w-full" placeholder="e.g., Drink Water" required />
        </div>
        <div class="form-control mb-4">
          <label class="label font-semibold" for="habitIcon">Icon</label>
          <select id="habitIcon" class="select select-bordered w-full">
            <option value="fire">🔥 Fire</option>
            <option value="heart">❤️ Heart</option>
            <option value="book-open">📖 Book</option>
            <option value="check-circle">✔️ Check</option>
          </select>
        </div>
        <div class="modal-action">
          <button type="button" id="addHabitBtn" class="btn btn-primary">Add Habit</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="storage.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="habbits.js"></script>

  </body>
</html>
