<!DOCTYPE html>
<html lang="hr" data-theme="light">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Prijava | DayCraft</title>
    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicons/favicon.png"
    />

    <!-- Tailwind CSS + DaisyUI (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex items-center justify-center h-screen bg-base-100">
    <!-- obrazac za prijavu -->
    <form id="loginForm" class="card w-96 bg-base-200 shadow-lg p-6 space-y-4">
      <h2 class="text-2xl font-bold text-center">Prijava</h2>

      <div class="form-control">
        <label class="label">
          <span class="label-text">E‑pošta</span>
        </label>
        <input
          type="email"
          id="email"
          class="input input-bordered"
          required
        />
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Lozinka</span>
        </label>
        <input
          type="password"
          id="password"
          class="input input-bordered"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-full">
        Prijavi se
      </button>
      <p id="loginError" class="text-red-500 text-sm hidden">Neispravna e‑pošta ili lozinka</p>

      <p class="text-sm text-center">
        Novi korisnik?
        <a href="register.html" class="link link-primary">
          Izradi račun
        </a>
      </p>
    </form>

    <!-- skripte za pohranu i autentikaciju -->
    <script type="module" src="storage.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
